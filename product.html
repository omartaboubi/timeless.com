<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TIMELESS — Product</title>

    <link rel="stylesheet"
          href="product.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <a href="index.html"
           class="logo">

            TIMELESS

        </a>

        <a href="index.html"
           class="back">

            ← BACK TO SHOP

        </a>

    </header>



    <!-- PRODUCT -->

    <main class="product-page">


        <!-- PHOTOS -->

        <div class="product-gallery">

            <!-- PHOTO 1 -->

            <img id="main-image"
                 src="864831934681442016.jpg"
                 alt="Product">


            <div class="thumbnail-container">

                <!-- PHOTO 1 -->

                <img id="thumb1"
                     src=""
                     alt="Product photo 1"
                     onclick="changeImage(this.src)">


                <!-- PHOTO 2 -->

                <img id="thumb2"
                     src="773908519_885779744328518_7055196251377693249_n.jpg"
                     alt="Product photo 2"
                     onclick="changeImage(this.src)">


                <!-- PHOTO 3 -->

                <img id="thumb3"
                     src=""
                     alt="Product photo 3"
                     onclick="changeImage(this.src)">


                <!-- PHOTO 4 -->

                <img id="thumb4"
                     src=""
                     alt="Product photo 4"
                     onclick="changeImage(this.src)">

            </div>

        </div>



        <!-- INFORMATION -->

        <div class="product-details">

            <p class="category"
               id="category">
            </p>


            <h1 id="product-name">
            </h1>


            <p class="price"
               id="product-price">
            </p>


            <p class="description"
               id="description">
            </p>


            <div class="line"></div>


            <h3>
                DETAILS
            </h3>


            <ul id="details">
            </ul>


            <button class="add-button"
                    onclick="addProductToBag()">

                ADD TO BAG

            </button>

        </div>

    </main>


    <script src="products.js"></script>

</body>

</html>
